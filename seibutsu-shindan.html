<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生物の参考書診断｜おすすめ参考書と参考書ルートが分かる | 受験診断ドットコム</title>
<meta name="description" content="目的・苦手分野・志望校などの質問に答えるだけで、56冊の中から今のあなたに合う生物の参考書を診断します。遺伝・考察・論述などの苦手分野別にも対応。定期テスト・共通テスト・二次試験の生物の参考書ルート選びに。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=49be6f4c">
<style>
  /* ==========================================================
     受験診断ドットコム — 数学診断 デザイントークン拡張
     ルートカラー = レベルカラーを再利用（意味の一貫性）
       定期テスト = lv1（緑） / 共通テスト = lv2（青） / 二次試験 = lv3（オレンジ）
     ========================================================== */
  :root{
    --lv5:#7d5ba6; /* 超級 */
    --paper-shadow: 0 28px 70px -24px rgba(0,0,0,0.6), 0 2px 0 rgba(255,255,255,0.4) inset;
  }

  @media (prefers-reduced-motion: no-preference){
    .card, .result-head, .shelf-wrap, .book-list{ animation: riseIn .38s cubic-bezier(.2,.8,.2,1) both; }
    .book-item{ animation: riseIn .3s cubic-bezier(.2,.8,.2,1) both; }
    .book-item:nth-child(1){ animation-delay:.02s; } .book-item:nth-child(2){ animation-delay:.06s; }
    .book-item:nth-child(3){ animation-delay:.10s; } .book-item:nth-child(4){ animation-delay:.14s; }
    .book-item:nth-child(5){ animation-delay:.18s; } .book-item:nth-child(6){ animation-delay:.22s; }
  }
  @keyframes riseIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }

  .page-wrap{ padding-top:44px; padding-bottom:130px; }
  h1.page-title{
    font-family:'Shippori Mincho', serif; font-weight:800;
    font-size:clamp(26px, 4.8vw, 38px); margin:0 0 6px; line-height:1.4; letter-spacing:0.01em;
  }
  .page-title-rule{
    width:56px; height:3px; background:var(--amber); border:none; margin:14px 0 18px; border-radius:2px;
  }
  .page-lead{ color:var(--text-on-ink-muted); font-size:14.5px; margin:0 0 30px; max-width:56ch; }

  /* -------------------- 経路表示（分岐ツリーを辿る足あと） -------------------- */
  .crumbs{ display:flex; flex-wrap:wrap; align-items:center; gap:0; margin-bottom:26px; row-gap:10px; }
  .crumb{
    font-size:11.5px; font-weight:700; padding:6px 13px 6px 12px; border-radius:8px;
    background:var(--ink-soft); color:var(--text-on-ink-muted);
    border:1px solid rgba(255,255,255,0.08);
    display:inline-flex; align-items:center; gap:6px;
    position:relative;
  }
  .crumb .k{ font-weight:500; opacity:.7; font-size:10.5px; }
  .crumb b{ color:var(--amber); font-weight:700; }
  .crumb + .crumb{ margin-left:6px; }
  .crumb-arrow{ color:var(--text-on-ink-muted); opacity:.4; font-size:12px; margin:0 2px; }

  /* -------------------- 質問カード -------------------- */
  .q-index{
    font-family:'Shippori Mincho', serif; font-size:12.5px; font-weight:700;
    color:var(--amber-deep); letter-spacing:0.14em; margin-bottom:12px;
    text-transform:uppercase;
  }
  .q-text{
    font-family:'Shippori Mincho', serif; font-size:clamp(19px, 3.4vw, 25px);
    font-weight:800; margin:0 0 26px; line-height:1.55; color:var(--text-on-paper);
  }
  .choices{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .choices.cols-1{ grid-template-columns:1fr; }
  .choices.cols-3{ grid-template-columns:1fr 1fr 1fr; }
  .choices.tags-grid{ grid-template-columns:repeat(3, 1fr); gap:10px; }

  .choice-btn{
    font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:15px;
    padding:16px 17px; border-radius:10px; border:2px solid rgba(27,33,48,0.10);
    background:#fff; color:var(--text-on-paper); cursor:pointer; text-align:left;
    transition:transform .14s cubic-bezier(.2,.8,.2,1), border-color .14s ease, background .14s ease, box-shadow .14s ease;
    position:relative;
  }
  .choice-btn:hover{
    border-color:var(--amber); background:#fffaf0; transform:translateY(-3px);
    box-shadow:0 10px 22px -12px rgba(196,127,31,0.5);
  }
  .choice-btn:active{ transform:translateY(-1px); }
  .choice-btn:focus-visible{ outline:2px solid var(--amber-deep); outline-offset:2px; }
  .choice-btn .sub{ display:block; font-weight:400; font-size:11.5px; color:#6b6250; margin-top:4px; }

  /* タグ風の分野選択（12分野）はコンパクトに */
  .tags-grid .choice-btn{
    text-align:center; padding:13px 10px; font-size:13.5px; border-radius:999px;
  }

  /* -------------------- スタート画面：3ルートを「見出しタブ」として -------------------- */
  .choice-btn[data-value="teiki"],
  .choice-btn[data-value="kyoutsuu"],
  .choice-btn[data-value="niji"]{
    padding:22px 22px 20px 24px; border-left-width:5px; border-radius:12px;
  }
  .choice-btn[data-value="teiki"]{ border-left-color:var(--lv1); }
  .choice-btn[data-value="kyoutsuu"]{ border-left-color:var(--lv2); }
  .choice-btn[data-value="niji"]{ border-left-color:var(--lv3); }
  .choice-btn[data-value="teiki"]:hover{ box-shadow:0 12px 26px -14px var(--lv1); border-color:var(--lv1); }
  .choice-btn[data-value="kyoutsuu"]:hover{ box-shadow:0 12px 26px -14px var(--lv2); border-color:var(--lv2); }
  .choice-btn[data-value="niji"]:hover{ box-shadow:0 12px 26px -14px var(--lv3); border-color:var(--lv3); }
  .choice-btn[data-value="teiki"] .sub,
  .choice-btn[data-value="kyoutsuu"] .sub,
  .choice-btn[data-value="niji"] .sub{ font-size:12.5px; margin-top:6px; }

  .nav-row{ display:flex; gap:16px; margin-top:20px; align-items:center; }
  .back-link{
    font-size:13px; color:var(--text-on-ink-muted); text-decoration:none; cursor:pointer;
    display:inline-flex; align-items:center; gap:5px;
  }
  .back-link:hover{ color:var(--amber); }

  /* -------------------- 結果画面 -------------------- */
  .result-head{ text-align:center; margin-bottom:32px; }
  .route-badge{
    display:inline-block; font-family:'Shippori Mincho', serif; font-weight:800;
    font-size:13px; letter-spacing:0.12em; padding:7px 18px; border-radius:999px;
    color:#fff; margin-bottom:16px; box-shadow:0 8px 18px -8px rgba(0,0,0,0.5);
  }
  .result-head h2{ font-family:'Shippori Mincho', serif; font-size:clamp(21px,4vw,27px); margin:0 0 10px; font-weight:800; }
  .result-head p{ color:var(--text-on-ink-muted); font-size:13.5px; max-width:52ch; margin:0 auto; }

  /* -------------------- 本棚（サイン要素）-------------------- */
  .shelf-wrap{ margin:26px 0 22px; }
  .shelf-label{
    font-size:11.5px; letter-spacing:0.1em; color:var(--text-on-ink-muted); margin-bottom:12px;
    font-weight:700; text-transform:uppercase;
  }
  .shelf{
    display:flex; align-items:flex-end; gap:7px;
    background:
      linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.3) 92%);
    padding:26px 18px 0;
    border-bottom:12px solid #3a2a1a;
    box-shadow: 0 8px 0 -2px #2a1d11, inset 0 -2px 4px rgba(0,0,0,0.3);
    border-radius:4px 4px 0 0; overflow-x:auto;
  }
  .spine{
    flex:0 0 auto; width:56px; height:182px; border-radius:3px 3px 1px 1px;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding-top:16px;
    box-shadow:
      inset 3px 0 0 rgba(255,255,255,0.15),
      inset -7px 0 12px rgba(0,0,0,0.22),
      0 6px 14px rgba(0,0,0,0.35);
    position:relative; transition:transform .18s cubic-bezier(.2,.8,.2,1);
  }
  .spine:hover{ transform:translateY(-10px) rotate(-0.5deg); }
  .spine span{
    writing-mode:vertical-rl; text-orientation:mixed; font-family:'Shippori Mincho', serif;
    font-weight:700; font-size:12px; color:#fff; letter-spacing:0.05em; max-height:118px;
  }
  .spine.tall{ height:200px; } .spine.short{ height:162px; }
  /* 帯（おび）— 日本の参考書によくある色帯を背表紙下部に */
  .spine::after{
    content:''; position:absolute; left:0; right:0; bottom:14px; height:22px;
    background:rgba(0,0,0,0.22);
    border-top:1px solid rgba(255,255,255,0.25);
    border-bottom:1px solid rgba(0,0,0,0.3);
  }
  .spine .rank{
    position:relative; z-index:1; margin-top:auto; margin-bottom:18px;
    font-family:'Zen Kaku Gothic New', sans-serif; font-weight:900; font-size:11px; color:#fff;
    writing-mode:horizontal-tb; opacity:.85;
  }

  .book-list{ margin-top:26px; display:flex; flex-direction:column; gap:12px; }

  /* -------------------- 表彰台（ベスト3ランキング） -------------------- */
  .podium{
    display:flex; align-items:flex-end; justify-content:center; gap:14px;
    margin:30px 0 8px; padding:0 10px;
  }
  .podium-col{ display:flex; flex-direction:column; align-items:center; width:96px; }
  .podium-book{
    width:100%; border-radius:10px 10px 0 0;
    display:flex; align-items:flex-start; justify-content:center; padding-top:12px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), 0 6px 14px rgba(0,0,0,0.3);
  }
  .podium-rank{ font-family:'Shippori Mincho', serif; font-weight:900; font-size:22px; color:var(--ink); }
  .podium-base{ width:100%; border-radius:0 0 6px 6px; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15); }
  .podium-1 .podium-book{ height:76px; } .podium-1 .podium-base{ height:56px; }
  .podium-2 .podium-book{ height:58px; } .podium-2 .podium-base{ height:40px; }
  .podium-3 .podium-book{ height:46px; } .podium-3 .podium-base{ height:30px; }
  .podium-1{ z-index:2; }
  .podium-2, .podium-3{ margin-bottom:2px; }

  /* 進捗 */
  .progress{ margin:0 0 14px; }
  .progress .p-label{ display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; color:var(--text-on-ink-muted); margin-bottom:7px; }
  .progress .p-label b{ color:var(--amber); font-size:14px; }
  .progress .p-bar{ height:6px; border-radius:999px; background:rgba(255,255,255,0.10); overflow:hidden; }
  .progress .p-bar i{ display:block; height:100%; border-radius:999px; background:var(--amber); transition:width .3s cubic-bezier(.2,.8,.2,1); }
  .back-btn{
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:13.5px; font-weight:700; cursor:pointer;
    background:none; border:1px solid rgba(255,255,255,0.25); color:var(--text-on-ink);
    padding:9px 18px; border-radius:999px; transition:border-color .14s ease, color .14s ease;
  }
  .back-btn:hover{ border-color:var(--amber); color:var(--amber); }

  /* 一致度・理由 */
  .match{ display:flex; align-items:center; gap:9px; margin:2px 0 8px; }
  .match .m-num{ font-weight:800; font-size:13px; color:var(--amber); white-space:nowrap; }
  .match .m-bar{ flex:1; max-width:160px; height:5px; border-radius:999px; background:rgba(255,255,255,0.10); overflow:hidden; }
  .match .m-bar i{ display:block; height:100%; background:var(--amber); border-radius:999px; }
  .reasons{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; }
  .reasons span{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; background:rgba(232,163,61,0.12); color:#f0c27a; }
  .reasons span.warn{ background:rgba(255,255,255,0.08); color:var(--text-on-ink-muted); }
  .book-actions{ display:flex; flex-wrap:wrap; align-items:center; gap:14px; }
  .article-link{ font-size:12px; font-weight:700; color:var(--text-on-ink-muted); text-decoration:none; }
  .article-link:hover{ color:var(--amber); }
  .more-books{ margin-top:14px; border:1px solid rgba(255,255,255,0.08); border-radius:10px; background:rgba(255,255,255,0.02); }
  .more-books summary{ cursor:pointer; padding:13px 17px; font-size:13.5px; font-weight:700; color:var(--text-on-ink); list-style:none; }
  .more-books summary::-webkit-details-marker{ display:none; }
  .more-books summary::after{ content:"＋"; float:right; color:var(--text-on-ink-muted); }
  .more-books[open] summary::after{ content:"－"; }
  .more-books .book-list{ padding:0 12px 12px; }
  .book-chip.sub-rank{ background:rgba(255,255,255,0.12) !important; color:var(--text-on-ink) !important; }

  .book-item.rank-1{
    border-color:rgba(232,163,61,0.4); background:linear-gradient(135deg, rgba(232,163,61,0.10), var(--ink-soft) 60%);
  }
  .book-item{
    background:var(--ink-soft); border-radius:10px; padding:15px 17px;
    display:flex; gap:13px; align-items:flex-start; border:1px solid rgba(255,255,255,0.06);
    transition:border-color .15s ease;
  }
  .book-item:hover{ border-color:rgba(232,163,61,0.3); }
  .book-chip{
    flex:0 0 auto; min-width:30px; height:30px; padding:0 8px; border-radius:8px; display:flex;
    align-items:center; justify-content:center; font-family:'Shippori Mincho', serif;
    font-weight:800; font-size:12px; color:#fff; white-space:nowrap;
  }
  .book-info{ flex:1; }
  .book-info .name{ font-weight:700; font-size:14.5px; margin:0 0 4px; line-height:1.5; }
  .book-info .name .scope-tag{
    display:inline-block; font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px;
    margin-left:6px; background:rgba(255,255,255,0.1); color:var(--text-on-ink-muted); vertical-align:middle;
  }
  .book-info .desc{ font-size:13px; color:#cfccc3; margin:2px 0 12px; line-height:1.85; }
  .book-info .desc .d-you{ display:block; margin-top:8px; padding-top:8px; border-top:1px dashed rgba(255,255,255,0.12); color:#f3e3c3; }
  .book-info .desc .d-you b{ display:block; font-size:11px; letter-spacing:0.08em; color:var(--amber); margin-bottom:2px; }
  .type-caret{ display:inline-block; width:0.55em; height:1.05em; margin-left:1px; vertical-align:-0.15em; background:var(--amber); animation:caret-blink .9s steps(1) infinite; }
  @keyframes caret-blink{ 50%{ opacity:0; } }
  .buy-link{
    display:inline-block; font-size:12px; font-weight:700; color:var(--ink);
    background:var(--amber); padding:6px 14px; border-radius:999px; text-decoration:none;
    transition:background .12s ease, transform .12s ease;
  }
  .pr-note{ text-align:center; font-size:12px; color:var(--text-on-ink-muted); margin:-20px 0 22px; }
  .pr-note .pr-tag{ display:inline-block; font-weight:700; font-size:11px; padding:1px 7px; margin-right:6px; border:1px solid currentColor; border-radius:4px; }
  .buy-link:hover{ background:#f0b357; transform:translateY(-1px); }
  .buy-link.buy-rakuten{ background:#bf0000; color:#fff; }
  .buy-link.buy-rakuten:hover{ background:#d81f1f; }
  .book-cover{ float:right; width:84px; margin:0 0 10px 16px; display:block; text-decoration:none; text-align:center; }
  .book-cover img{ display:block; width:84px; height:auto; border-radius:3px; background:#fff; box-shadow:0 6px 16px rgba(0,0,0,0.45); transition:transform .15s ease; }
  .book-cover:hover img{ transform:translateY(-2px); }
  .book-cover span{ display:block; margin-top:6px; font-size:10.5px; font-weight:700; color:#ff6b6b; }
  .book-info{ min-width:0; } .book-actions{ clear:both; }
  @media (max-width:560px){ .book-cover{ width:60px; margin-left:10px; } .book-cover img{ width:60px; } .book-cover span{ font-size:9.5px; } }

  .empty-note{
    background:var(--ink-soft); border:1px dashed rgba(255,255,255,0.15); border-radius:10px;
    padding:24px; text-align:center; color:var(--text-on-ink-muted); font-size:13px;
  }

  .retry-btn{
    margin-top:34px; display:inline-block; background:none; border:1px solid rgba(255,255,255,0.25);
    color:var(--text-on-ink); padding:13px 24px; border-radius:999px; font-size:14px; font-weight:700;
    cursor:pointer; font-family:'Zen Kaku Gothic New', sans-serif;
    transition:border-color .14s ease, color .14s ease, transform .14s ease;
  }
  .retry-btn:hover{ border-color:var(--amber); color:var(--amber); transform:translateY(-2px); }

  @media (max-width:520px){
    .choices, .choices.cols-3{ grid-template-columns:1fr; }
    .choices.tags-grid{ grid-template-columns:repeat(2, 1fr); }
    .card{ padding:26px 20px; }
  }
  .textbook-base{ background:var(--ink-soft); border:1px solid rgba(232,163,61,0.45); border-left:4px solid var(--amber); border-radius:10px; padding:16px 18px; margin:0 0 22px; }
  .textbook-base .tb-label{ display:inline-block; font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--ink); background:var(--amber); padding:2px 9px; border-radius:999px; }
  .textbook-base .tb-name{ font-weight:700; font-size:15.5px; margin:8px 0 6px; }
  .textbook-base .tb-desc{ font-size:13.5px; line-height:1.85; color:var(--text-on-ink-muted); margin:0 0 10px; }
  .textbook-base .tb-desc b{ color:var(--text-on-ink); }
</style>

let answers = {};

const clone = o => JSON.parse(JSON.stringify(o));
const quizArea = document.getElementById("quiz-area");
const crumbsEl = document.getElementById("crumbs");

function renderCrumbs(){
  const a = answers, labels = [];
  if(a.purpose) labels.push(["目的", routeName[a.purpose]]);
  if(a.range) labels.push(["範囲", a.range==="kiso" ? "生物基礎" : "生物基礎＋生物"]);
  if(a.statusLabel) labels.push(["状況", a.statusLabel]);
  if(a.bunya) labels.push(["苦手", BUNYA_NAME[a.bunya]]);
  if(a.shibouLabel) labels.push(["志望", a.shibouLabel]);
  if(a.style) labels.push(["参考書", a.style==="quality" ? "講義" : "問題集"]);
  crumbsEl.innerHTML = labels.map(([k,v], i) =>
    (i>0?'<span class="crumb-arrow">→</span>':'') + `<span class="crumb"><span class="k">${k}</span><b>${v}</b></span>`
  ).join("");
}

function go(step){ stack.push({step, snap:clone(answers)}); renderStep(step); }
function back(){
  if(stack.length<=1) return;
  stack.pop();
  const top = stack[stack.length-1];
  answers = clone(top.snap);
  renderStep(top.step);
}

function plannedSteps(){
  const a = answers, list = ["start"];
  if(!a.purpose) return null;
  list.push("range","status");
  if(a.statusKey==="bunya") list.push("bunya");
  if(a.purpose==="niji") list.push("shibou");
  list.push("style");
  return list;
}
function progressHtml(){
  const cur = stack.length;
  const plan = plannedSteps();
  const total = plan ? Math.max(plan.length, cur) : null;
  const pct = total ? Math.round((cur-1)/total*100) : 6;
  return `<div class="progress"><div class="p-label"><span><b>Q${cur}</b>${total?` / ${total}`:''}</span><span>${total?`あと${total-cur+1}問`:''}</span></div>
    <div class="p-bar"><i style="width:${pct}%"></i></div></div>`;
}
function renderQ(index, qText, choices, colClass){

    <div class="q-index">${index}</div>
    <p class="q-text">${qText}</p>
    <div class="choices ${colClass||''}">`;
  choices.forEach(c=>{
    html += `<button class="choice-btn" data-value="${c.value}">${c.label}${c.sub?`<span class="sub">${c.sub}</span>`:''}</button>`;
  });
  html += `</div></div>`;
  if(stack.length > 1) html += `<div class="nav-row"><button class="back-btn" id="back-btn">← 前の質問に戻る</button></div>`;
  quizArea.innerHTML = html;
  renderCrumbs();
  const bb = document.getElementById("back-btn");
  if(bb) bb.addEventListener("click", back);
  return quizArea.querySelectorAll(".choice-btn");
}

    }
    next();
  });
}
function next(){ go(answers.purpose==="niji" ? "shibou" : "style"); }
function stepShibou(){
  const btns = renderQ("二次・私大対策", "志望校のレベルは？", [
    {label:"中堅国公立・MARCH・関関同立", value:"chuken"},
    {label:"難関国公立・早慶", value:"nankan"},
    {label:"東大・京大・医学部", value:"saiken"},
  ], "cols-1");
  bindChoice(btns, (v, el) => { answers.shibou = v; answers.shibouLabel = el.childNodes[0].nodeValue.trim(); go("style"); });
}
function stepStyle(){
  const btns = renderQ(routeName[answers.purpose], "どんな本がいい？", [
    {label:"講義で理解したい", sub:"読んで分かる本", value:"quality"},
    {label:"問題を解いて覚えたい", sub:"演習中心の本", value:"quantity"},
  ]);
  bindChoice(btns, v => { answers.style = v; go("result"); });
}

/* ============================================================
   結果算出
   ============================================================ */
const SHIBOU_TIER = { chuken:3, nankan:4, saiken:5 };
function pickTier(){
  const a = answers;
  if(a.bunya){
    if(a.purpose!=="niji") return 2;
    return SHIBOU_TIER[a.shibou] || 3;
  }
  if(a.statusKey==="hajime") return 1;
  if(a.statusKey==="yonda") return 2;
  if(a.statusKey==="nankan") return SHIBOU_TIER[a.shibou] || 4;
  return 2;
}
/* 本のレベルと目標レベルの差（基礎から最難関まで扱う本は、その幅の中なら差0） */
function tierGap(b, t){ const lo=b.tier, hi=b.tierMax||b.tier; return t<lo ? lo-t : (t>hi ? t-hi : 0); }
function signedGap(b, t){ const lo=b.tier, hi=b.tierMax||b.tier; return t<lo ? lo-t : (t>hi ? hi-t : 0); }
function scoreBook(b, targetTier){
  const a = answers;
  if(!b.purposes.includes(a.purpose)) return -Infinity;
  if(a.range==="kiso" && b.scope==="full") return -Infinity;
  if(a.range==="full" && b.scope==="kiso") return -Infinity;
  if((b.igaku || b.saikenOnly) && a.shibou!=="saiken") return -Infinity;
  let s = 0;
  if(a.bunya){
    const primary = b.bunya.includes(a.bunya), also = b.also.includes(a.bunya);
    if(!primary && !also) return -Infinity;
    if(primary) s += 6;
  } else if(b.bunya.length){
    return -Infinity;
  }
  s += 5 - tierGap(b, targetTier)*2;
  // 難関大志望（難関国公立・早慶／東大・京大・医学部）の二次対策では必ず上位に出す本
  if(b.mustNankan && a.purpose==="niji" && (a.shibou==="nankan" || a.shibou==="saiken")) s += 6;
  if(FAVORITE.has(b.name) && !b.support) s += 3;
  if(a.purpose==="kyoutsuu" && b.purposes.length===1) s += 1; // 共通テスト専用の本は、共通テスト対策で汎用書より少し優先する
  if(b.support) s -= 3; // 一問一答・用語集・書き込みノートは補助教材なので、メインの本より下に出す
  if(a.style==="quality" && b.type==="quality") s += 2;
  if(a.style==="quantity" && b.type==="quantity") s += 2;
  return s;
}
function explainBook(b, s, targetTier, maxScore){
  const tags = [];
  const primary = answers.bunya && b.bunya.includes(answers.bunya);
  if(primary) tags.push({t:`${BUNYA_NAME[answers.bunya]}の専用書`});
  const d = primary ? 0 : signedGap(b, targetTier); // 専用書は分野の基礎から扱うので、レベルの差は表示しない
  if(primary) {}
  else if(d===0) tags.push({t:"レベルがぴったり"});
  else if(d>0) tags.push({t:"やや難しめ", warn:true});
  else tags.push({t:"やや易しめ", warn:true});
  tags.push({t:{teiki:"定期テスト向け", kyoutsuu:"共通テスト向け", niji:"二次・私大向け"}[answers.purpose]});
  if(answers.style==="quality" && b.type==="quality") tags.push({t:"講義型"});
  if(answers.style==="quantity" && b.type==="quantity") tags.push({t:"問題演習型"});
  const pct = Math.max(0, Math.min(100, Math.round(s / maxScore * 100)));
  return {pct, tags};
}
function hitokoto(ex){
  const sh = answers.shibouLabel;
  const lead = sh ? `${sh}志望なら、` : "今の条件なら、";
  const t = ex.tags.map(x=>x.t);
  let body;
  if(t.some(x=>/の専用書$/.test(x))) body = "苦手な分野だけを集中して固められる1冊です。解けなかった問題は教科書の該当ページにも戻りましょう。";
  else if(t.includes("やや難しめ")) body = "少し背伸びになるので、前段階の本と並行すると効果的です。";
  else if(t.includes("やや易しめ")) body = "穴を埋める総復習として短期間で回すのに向いています。";
  else body = "今のレベルにちょうど合う1冊です。";
  return lead + body;
}

function typeDescriptions(){
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const list = document.querySelector(".book-list");
  if(!list || reduce) return;
  const items = Array.from(list.querySelectorAll(":scope > .book-item")).slice(0,3);
  const jobs = items.map(item => {
    const desc = item.querySelector(".desc");
    if(!desc) return null;
    desc.style.minHeight = desc.offsetHeight + "px";
    const walker = document.createTreeWalker(desc, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while(walker.nextNode()) nodes.push({node:walker.currentNode, text:walker.currentNode.nodeValue});
    nodes.forEach(n => n.node.nodeValue = "");
    const job = {item, desc, nodes, ni:0, ci:0, done:false, caret:null};
    item.addEventListener("click", e => { if(e.target.closest("a")) return; finish(job); }, {once:true});
    return job;
  }).filter(Boolean);
  function finish(job){
    if(job.done) return;
    job.nodes.forEach(n => n.node.nodeValue = n.text);
    if(job.caret) job.caret.remove();
    job.done = true; job.desc.style.minHeight = "";
  }
  let k = 0;
  function step(){
    while(k < jobs.length && jobs[k].done) k++;
    if(k >= jobs.length) return;
    const job = jobs[k];
    if(!job.caret){ job.caret = document.createElement("span"); job.caret.className = "type-caret"; }
    const cur = job.nodes[job.ni];
    if(!cur){ finish(job); k++; setTimeout(step, 260); return; }
    if(job.caret.previousSibling !== cur.node) cur.node.parentNode.insertBefore(job.caret, cur.node.nextSibling);
    job.ci++;
    cur.node.nodeValue = cur.text.slice(0, job.ci);
    if(job.ci >= cur.text.length){ job.ni++; job.ci = 0; }
    setTimeout(step, 25);
  }
  setTimeout(step, 350);
}

function bookItemHtml(b, i, chipLabel, chipBg, ex, isSub){
  const cv = COVERS[b.name];
  const scopeLabel = b.scope==="kiso" ? "生物基礎" : (b.scope==="full" ? "生物" : "");
  return `<div class="book-item rank-${i+1}">
    <div class="book-chip${isSub?' sub-rank':''}" style="background:${chipBg}; color:var(--ink);">${chipLabel}</div>
    <div class="book-info">
      ${cv&&cv.i?`<a class="book-cover" href="${cv.u}" target="_blank" rel="sponsored noopener" aria-label="${b.name}を楽天で見る"><img src="${cv.i}" alt="${b.name}の表紙" width="84" height="120" loading="lazy" decoding="async"><span>楽天で見る</span></a>`:''}
      <p class="name">${b.name}${scopeLabel?`<span class="scope-tag">${scopeLabel}</span>`:''}</p>
      <div class="match"><span class="m-num">一致度 ${ex.pct}%</span><span class="m-bar"><i style="width:${ex.pct}%"></i></span></div>
      <div class="reasons">${ex.tags.map(x=>`<span${x.warn?' class="warn"':''}>${x.t}</span>`).join('')}</div>
      <p class="desc">${b.note?`<span class="d-note">${b.note}</span>`:''}<span class="d-you"><b>あなたへのひとこと</b>${hitokoto(ex)}</span></p>
      <div class="book-actions">
        <a class="buy-link" href="${amazonUrl(b)}" target="_blank" rel="sponsored noopener">Amazonで見る</a>
        ${cv?`<a class="buy-link buy-rakuten" href="${cv.u}" target="_blank" rel="sponsored noopener">楽天で見る</a>`:''}
        ${b.article?`<a class="article-link" href="articles/${b.article}.html">解説記事を読む →</a>`:''}
      </div>
    </div>
  </div>`;
}

const TEXTBOOK_HTML = `<div class="textbook-base">
  <span class="tb-label">すべての土台</span>
  <p class="tb-name">学校の教科書（生物基礎・生物）</p>
  <p class="tb-desc">入試で問われる知識の出どころは教科書です。難関大の問題も教科書の知識を使って初めて見る実験やデータを考えさせる形になっています。<b>下の参考書は教科書を置き換えるものではなく、教科書を読みやすくして使える形にするための補助です。</b>迷ったら教科書に戻りましょう。</p>
  <a class="article-link" href="articles/seibutsu-benkyouhou.html">生物の勉強法の記事を読む →</a>
</div>`;

function renderResult(){
  const targetTier = pickTier();
  const scored = BOOKS.map(b => ({b, s:scoreBook(b, targetTier)}))
                      .filter(x => x.s > -Infinity)
                      .sort((a,b)=> b.s - a.s);
  // 1位が大森徹先生の本になったら、ほかの本のうち最上位のものを1位に上げる
  const firstOk = scored.findIndex(x => !x.b.noTop);
  if(firstOk > 0) scored.unshift(scored.splice(firstOk, 1)[0]);
  const top = scored.slice(0,3), others = scored.slice(3,6);
  const maxScore = (answers.bunya ? 6 : 0) + 10 + (answers.purpose==="niji" && (answers.shibou==="nankan"||answers.shibou==="saiken") ? 6 : 0);
  const exOf = x => explainBook(x.b, x.s, targetTier, maxScore);

  document.getElementById("page-title").innerHTML = "診断結果";
  document.getElementById("page-lead").innerHTML = top.length<=1 ? "あなたに一番合う参考書はこちらです。" : ("あなたに一番合う参考書、ベスト" + top.length + "はこちら。");

  const parts = [answers.range==="kiso" ? "生物基礎" : "生物基礎＋生物"];
  if(answers.bunya) parts.push(BUNYA_NAME[answers.bunya] + "が苦手");
  else parts.push(answers.statusLabel);
  if(answers.shibouLabel) parts.push(answers.shibouLabel + "志望");

  const MEDAL = ["var(--amber)", "#C7CDD6", "#C98A4B"];
  const MEDAL_LABEL = ["No.1 イチオシ", "No.2", "No.3"];
  let bodyHtml;
  if(!top.length){
    bodyHtml = '<div class="empty-note">条件に合う参考書が見つかりませんでした。選択を変えてもう一度お試しください。</div>';
  } else {
    let podiumHtml = '';
    if(top.length >= 2){
      const order = top.length===3 ? [1,0,2] : [0,1];
      podiumHtml = '<div class="podium">' + order.map(idx => `
        <div class="podium-col ${idx===0?"podium-1":(idx===1?"podium-2":"podium-3")}">
          <div class="podium-book" style="background:${MEDAL[idx]}"><span class="podium-rank">${idx+1}</span></div>
          <div class="podium-base" style="background:${MEDAL[idx]}"></div>
        </div>`).join('') + '</div>';
    }
    let listHtml = '<div class="book-list">';
    top.forEach((x,i)=>{ listHtml += bookItemHtml(x.b, i, top.length===1 ? "イチオシ" : MEDAL_LABEL[i], MEDAL[i], exOf(x), false); });
    listHtml += '</div>';
    if(others.length){
      listHtml += `<details class="more-books"><summary>ほかの候補（${others.length}冊）</summary><div class="book-list">`;
      others.forEach((x,k)=>{ listHtml += bookItemHtml(x.b, 3+k, `No.${4+k}`, "", exOf(x), true); });
      listHtml += '</div></details>';
    }
    bodyHtml = '<p class="pr-note"><span class="pr-tag">PR</span>このページにはアフィリエイト広告が含まれています</p>' + TEXTBOOK_HTML + podiumHtml + listHtml;
  }

  quizArea.innerHTML = `
    <div class="result-head">
      <span class="route-badge" style="background:${routeColor[answers.purpose]}">${routeName[answers.purpose]}</span>
      <h2>${parts.join(" ・ ")}</h2>
    </div>
    ${bodyHtml}
    <div style="text-align:center;"><button class="retry-btn" id="retry-btn">もう一度診断する</button></div>
    <p class="disclaimer" style="margin-top:28px;">
      ※本診断は一般的な学習ルートの目安であり、個々の学力・志望校の出題傾向によって最適な参考書は異なります。<br>
      ※Amazonのアソシエイトとして、当メンバーは適格販売により収入を得ています。当サイトは楽天アフィリエイトに参加しています。
    </p>`;
  renderCrumbs();
  typeDescriptions();
  document.getElementById("retry-btn").addEventListener("click", ()=>{
    answers = {}; stack = [{step:"start", snap:{}}];
    document.getElementById("page-title").innerHTML = "目的別・生物参考書診断";
    document.getElementById("page-lead").innerHTML = PAGE_LEAD;
    renderStep("start");
  });
}
const PAGE_LEAD = document.getElementById("page-lead").innerHTML;
renderStep("start");
