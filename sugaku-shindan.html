<meta charset="UTF-8">

<title>数学の参考書診断｜おすすめ参考書と参考書ルートが分かる | 受験診断ドットコム</title>
<meta name="description" content="目的・偏差値・志望校などの質問に答えるだけで、111冊の中から今のあなたに合う数学の参考書を診断します。定期テスト・共通テスト・二次試験に対応した数学の参考書ルート選びに。">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
  /* ==========================================================
     受験診断ドットコム — 数学診断 デザイントークン拡張
     ルートカラー = レベルカラーを再利用（意味の一貫性）
       定期テスト = lv1（緑） / 共通テスト = lv2（青） / 二次試験 = lv3（オレンジ）
     ========================================================== */
  :root{
    --lv5:#7d5ba6; /* 超級 */
    --paper-shadow: 0 28px 70px -24px rgba(0,0,0,0.6), 0 2px 0 rgba(255,255,255,0.4) inset;
  }

  @media (prefers-reduced-motion: no-preference){
    .card, .result-head, .shelf-wrap, .book-list{ animation: riseIn .38s cubic-bezier(.2,.8,.2,1) both; }
    .book-item{ animation: riseIn .3s cubic-bezier(.2,.8,.2,1) both; }
    .book-item:nth-child(1){ animation-delay:.02s; } .book-item:nth-child(2){ animation-delay:.06s; }
    .book-item:nth-child(3){ animation-delay:.10s; } .book-item:nth-child(4){ animation-delay:.14s; }
    .book-item:nth-child(5){ animation-delay:.18s; } .book-item:nth-child(6){ animation-delay:.22s; }
  }
  @keyframes riseIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }

  .page-wrap{ padding-top:44px; padding-bottom:130px; }
  h1.page-title{
    font-family:'Shippori Mincho', serif; font-weight:800;
    font-size:clamp(26px, 4.8vw, 38px); margin:0 0 6px; line-height:1.4; letter-spacing:0.01em;
  }
  .page-title-rule{
    width:56px; height:3px; background:var(--amber); border:none; margin:14px 0 18px; border-radius:2px;
  }
  .page-lead{ color:var(--text-on-ink-muted); font-size:14.5px; margin:0 0 30px; max-width:56ch; }

  /* -------------------- 経路表示（分岐ツリーを辿る足あと） -------------------- */
  .crumbs{ display:flex; flex-wrap:wrap; align-items:center; gap:0; margin-bottom:26px; row-gap:10px; }
  .crumb{
    font-size:11.5px; font-weight:700; padding:6px 13px 6px 12px; border-radius:8px;
    background:var(--ink-soft); color:var(--text-on-ink-muted);
    border:1px solid rgba(255,255,255,0.08);
    display:inline-flex; align-items:center; gap:6px;
    position:relative;
  }
  .crumb .k{ font-weight:500; opacity:.7; font-size:10.5px; }
  .crumb b{ color:var(--amber); font-weight:700; }
  .crumb + .crumb{ margin-left:6px; }
  .crumb-arrow{ color:var(--text-on-ink-muted); opacity:.4; font-size:12px; margin:0 2px; }

  /* -------------------- 質問カード -------------------- */
  .q-index{
    font-family:'Shippori Mincho', serif; font-size:12.5px; font-weight:700;
    color:var(--amber-deep); letter-spacing:0.14em; margin-bottom:12px;
    text-transform:uppercase;
  }
  .q-text{
    font-family:'Shippori Mincho', serif; font-size:clamp(19px, 3.4vw, 25px);
    font-weight:800; margin:0 0 26px; line-height:1.55; color:var(--text-on-paper);
  }
  .choices{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .choices.cols-1{ grid-template-columns:1fr; }
  .choices.cols-3{ grid-template-columns:1fr 1fr 1fr; }
  .choices.tags-grid{ grid-template-columns:repeat(3, 1fr); gap:10px; }

  .choice-btn{
    font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:15px;
    padding:16px 17px; border-radius:10px; border:2px solid rgba(27,33,48,0.10);
    background:#fff; color:var(--text-on-paper); cursor:pointer; text-align:left;
    transition:transform .14s cubic-bezier(.2,.8,.2,1), border-color .14s ease, background .14s ease, box-shadow .14s ease;
    position:relative;
  }
  .choice-btn:hover{
    border-color:var(--amber); background:#fffaf0; transform:translateY(-3px);
    box-shadow:0 10px 22px -12px rgba(196,127,31,0.5);
  }
  .choice-btn:active{ transform:translateY(-1px); }
  .choice-btn:focus-visible{ outline:2px solid var(--amber-deep); outline-offset:2px; }
  .choice-btn .sub{ display:block; font-weight:400; font-size:11.5px; color:#6b6250; margin-top:4px; }

  /* タグ風の分野選択（12分野）はコンパクトに */
  .tags-grid .choice-btn{
    text-align:center; padding:13px 10px; font-size:13.5px; border-radius:999px;
  }

  /* -------------------- スタート画面：3ルートを「見出しタブ」として -------------------- */
  .choice-btn[data-value="teiki"],
  .choice-btn[data-value="kyoutsuu"],
  .choice-btn[data-value="niji"]{
    padding:22px 22px 20px 24px; border-left-width:5px; border-radius:12px;
  }
  .choice-btn[data-value="teiki"]{ border-left-color:var(--lv1); }
  .choice-btn[data-value="kyoutsuu"]{ border-left-color:var(--lv2); }
  .choice-btn[data-value="niji"]{ border-left-color:var(--lv3); }
  .choice-btn[data-value="teiki"]:hover{ box-shadow:0 12px 26px -14px var(--lv1); border-color:var(--lv1); }
  .choice-btn[data-value="kyoutsuu"]:hover{ box-shadow:0 12px 26px -14px var(--lv2); border-color:var(--lv2); }
  .choice-btn[data-value="niji"]:hover{ box-shadow:0 12px 26px -14px var(--lv3); border-color:var(--lv3); }
  .choice-btn[data-value="teiki"] .sub,
  .choice-btn[data-value="kyoutsuu"] .sub,
  .choice-btn[data-value="niji"] .sub{ font-size:12.5px; margin-top:6px; }

  .nav-row{ display:flex; gap:16px; margin-top:20px; align-items:center; }
  .back-link{
    font-size:13px; color:var(--text-on-ink-muted); text-decoration:none; cursor:pointer;
    display:inline-flex; align-items:center; gap:5px;
  }
  .back-link:hover{ color:var(--amber); }

  /* -------------------- 結果画面 -------------------- */
  .result-head{ text-align:center; margin-bottom:32px; }
  .route-badge{
    display:inline-block; font-family:'Shippori Mincho', serif; font-weight:800;
    font-size:13px; letter-spacing:0.12em; padding:7px 18px; border-radius:999px;
    color:#fff; margin-bottom:16px; box-shadow:0 8px 18px -8px rgba(0,0,0,0.5);
  }
  .result-head h2{ font-family:'Shippori Mincho', serif; font-size:clamp(21px,4vw,27px); margin:0 0 10px; font-weight:800; }
  .result-head p{ color:var(--text-on-ink-muted); font-size:13.5px; max-width:52ch; margin:0 auto; }

  /* -------------------- 本棚（サイン要素）-------------------- */
  .shelf-wrap{ margin:26px 0 22px; }
  .shelf-label{
    font-size:11.5px; letter-spacing:0.1em; color:var(--text-on-ink-muted); margin-bottom:12px;
    font-weight:700; text-transform:uppercase;
  }
  .shelf{
    display:flex; align-items:flex-end; gap:7px;
    background:
      linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.3) 92%);
    padding:26px 18px 0;
    border-bottom:12px solid #3a2a1a;
    box-shadow: 0 8px 0 -2px #2a1d11, inset 0 -2px 4px rgba(0,0,0,0.3);
    border-radius:4px 4px 0 0; overflow-x:auto;
  }
  .spine{
    flex:0 0 auto; width:56px; height:182px; border-radius:3px 3px 1px 1px;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding-top:16px;
    box-shadow:
      inset 3px 0 0 rgba(255,255,255,0.15),
      inset -7px 0 12px rgba(0,0,0,0.22),
      0 6px 14px rgba(0,0,0,0.35);
    position:relative; transition:transform .18s cubic-bezier(.2,.8,.2,1);
  }
  .spine:hover{ transform:translateY(-10px) rotate(-0.5deg); }
  .spine span{
    writing-mode:vertical-rl; text-orientation:mixed; font-family:'Shippori Mincho', serif;
    font-weight:700; font-size:12px; color:#fff; letter-spacing:0.05em; max-height:118px;
  }
  .spine.tall{ height:200px; } .spine.short{ height:162px; }
  /* 帯（おび）— 日本の参考書によくある色帯を背表紙下部に */
  .spine::after{
    content:''; position:absolute; left:0; right:0; bottom:14px; height:22px;
    background:rgba(0,0,0,0.22);
    border-top:1px solid rgba(255,255,255,0.25);
    border-bottom:1px solid rgba(0,0,0,0.3);
  }
  .spine .rank{
    position:relative; z-index:1; margin-top:auto; margin-bottom:18px;
    font-family:'Zen Kaku Gothic New', sans-serif; font-weight:900; font-size:11px; color:#fff;
    writing-mode:horizontal-tb; opacity:.85;
  }

  .book-list{ margin-top:26px; display:flex; flex-direction:column; gap:12px; }

  /* -------------------- 表彰台（ベスト3ランキング） -------------------- */
  .podium{
    display:flex; align-items:flex-end; justify-content:center; gap:14px;
    margin:30px 0 8px; padding:0 10px;
  }
  .podium-col{ display:flex; flex-direction:column; align-items:center; width:96px; }
  .podium-book{
    width:100%; border-radius:10px 10px 0 0;
    display:flex; align-items:flex-start; justify-content:center; padding-top:12px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), 0 6px 14px rgba(0,0,0,0.3);
  }
  .podium-rank{ font-family:'Shippori Mincho', serif; font-weight:900; font-size:22px; color:var(--ink); }
  .podium-base{ width:100%; border-radius:0 0 6px 6px; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15); }
  .podium-1 .podium-book{ height:76px; } .podium-1 .podium-base{ height:56px; }
  .podium-2 .podium-book{ height:58px; } .podium-2 .podium-base{ height:40px; }
  .podium-3 .podium-book{ height:46px; } .podium-3 .podium-base{ height:30px; }
  .podium-1{ z-index:2; }
  .podium-2, .podium-3{ margin-bottom:2px; }

  /* 進捗 */
  .progress{ margin:0 0 14px; }
  .progress .p-label{ display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; color:var(--text-on-ink-muted); margin-bottom:7px; }
  .progress .p-label b{ color:var(--amber); font-size:14px; }
  .progress .p-bar{ height:6px; border-radius:999px; background:rgba(255,255,255,0.10); overflow:hidden; }
  .progress .p-bar i{ display:block; height:100%; border-radius:999px; background:var(--amber); transition:width .3s cubic-bezier(.2,.8,.2,1); }
  .back-btn{
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:13.5px; font-weight:700; cursor:pointer;
    background:none; border:1px solid rgba(255,255,255,0.25); color:var(--text-on-ink);
    padding:9px 18px; border-radius:999px; transition:border-color .14s ease, color .14s ease;
  }
  .back-btn:hover{ border-color:var(--amber); color:var(--amber); }

  /* 一致度・理由 */
  .match{ display:flex; align-items:center; gap:9px; margin:2px 0 8px; }
  .match .m-num{ font-weight:800; font-size:13px; color:var(--amber); white-space:nowrap; }
  .match .m-bar{ flex:1; max-width:160px; height:5px; border-radius:999px; background:rgba(255,255,255,0.10); overflow:hidden; }
  .match .m-bar i{ display:block; height:100%; background:var(--amber); border-radius:999px; }
  .reasons{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; }
  .reasons span{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; background:rgba(232,163,61,0.12); color:#f0c27a; }
  .reasons span.warn{ background:rgba(255,255,255,0.08); color:var(--text-on-ink-muted); }
  .book-actions{ display:flex; flex-wrap:wrap; align-items:center; gap:14px; }
  .article-link{ font-size:12px; font-weight:700; color:var(--text-on-ink-muted); text-decoration:none; }
  .article-link:hover{ color:var(--amber); }
  .more-books{ margin-top:14px; border:1px solid rgba(255,255,255,0.08); border-radius:10px; background:rgba(255,255,255,0.02); }
  .more-books summary{ cursor:pointer; padding:13px 17px; font-size:13.5px; font-weight:700; color:var(--text-on-ink); list-style:none; }
  .more-books summary::-webkit-details-marker{ display:none; }
  .more-books summary::after{ content:"＋"; float:right; color:var(--text-on-ink-muted); }
  .more-books[open] summary::after{ content:"－"; }
  .more-books .book-list{ padding:0 12px 12px; }
  .book-chip.sub-rank{ background:rgba(255,255,255,0.12) !important; color:var(--text-on-ink) !important; }

  .book-item.rank-1{
    border-color:rgba(232,163,61,0.4); background:linear-gradient(135deg, rgba(232,163,61,0.10), var(--ink-soft) 60%);
  }
  .book-item{
    background:var(--ink-soft); border-radius:10px; padding:15px 17px;
    display:flex; gap:13px; align-items:flex-start; border:1px solid rgba(255,255,255,0.06);
    transition:border-color .15s ease;
  }
  .book-item:hover{ border-color:rgba(232,163,61,0.3); }
  .book-chip{
    flex:0 0 auto; min-width:30px; height:30px; padding:0 8px; border-radius:8px; display:flex;
    align-items:center; justify-content:center; font-family:'Shippori Mincho', serif;
    font-weight:800; font-size:12px; color:#fff; white-space:nowrap;
  }
  .book-info{ flex:1; }
  .book-info .name{ font-weight:700; font-size:14.5px; margin:0 0 4px; line-height:1.5; }
  .book-info .name .scope-tag{
    display:inline-block; font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px;
    margin-left:6px; background:rgba(255,255,255,0.1); color:var(--text-on-ink-muted); vertical-align:middle;
  }
  .book-info .desc{ font-size:13px; color:#cfccc3; margin:2px 0 12px; line-height:1.85; }
  .book-info .desc .d-you{ display:block; margin-top:8px; padding-top:8px; border-top:1px dashed rgba(255,255,255,0.12); color:#f3e3c3; }
  .book-info .desc .d-you b{ display:block; font-size:11px; letter-spacing:0.08em; color:var(--amber); margin-bottom:2px; }
  .type-caret{ display:inline-block; width:0.55em; height:1.05em; margin-left:1px; vertical-align:-0.15em; background:var(--amber); animation:caret-blink .9s steps(1) infinite; }
  @keyframes caret-blink{ 50%{ opacity:0; } }
  .buy-link{
    display:inline-block; font-size:12px; font-weight:700; color:var(--ink);
    background:var(--amber); padding:6px 14px; border-radius:999px; text-decoration:none;
    transition:background .12s ease, transform .12s ease;
  }
  .pr-note{ text-align:center; font-size:12px; color:var(--text-on-ink-muted); margin:-20px 0 22px; }
  .pr-note .pr-tag{ display:inline-block; font-weight:700; font-size:11px; padding:1px 7px; margin-right:6px; border:1px solid currentColor; border-radius:4px; }
  .buy-link:hover{ background:#f0b357; transform:translateY(-1px); }
  .buy-link.buy-rakuten{ background:#bf0000; color:#fff; }
  .buy-link.buy-rakuten:hover{ background:#d81f1f; }
  .book-cover{ float:right; width:84px; margin:0 0 10px 16px; display:block; text-decoration:none; text-align:center; }
  .book-cover img{ display:block; width:84px; height:auto; border-radius:3px; background:#fff; box-shadow:0 6px 16px rgba(0,0,0,0.45); transition:transform .15s ease; }
  .book-cover:hover img{ transform:translateY(-2px); }
  .book-cover span{ display:block; margin-top:6px; font-size:10.5px; font-weight:700; color:#ff6b6b; }
  .book-info{ min-width:0; } .book-actions{ clear:both; }
  @media (max-width:560px){ .book-cover{ width:60px; margin-left:10px; } .book-cover img{ width:60px; } .book-cover span{ font-size:9.5px; } }

  .empty-note{
    background:var(--ink-soft); border:1px dashed rgba(255,255,255,0.15); border-radius:10px;
    padding:24px; text-align:center; color:var(--text-on-ink-muted); font-size:13px;
  }

  .retry-btn{
    margin-top:34px; display:inline-block; background:none; border:1px solid rgba(255,255,255,0.25);
    color:var(--text-on-ink); padding:13px 24px; border-radius:999px; font-size:14px; font-weight:700;
    cursor:pointer; font-family:'Zen Kaku Gothic New', sans-serif;
    transition:border-color .14s ease, color .14s ease, transform .14s ease;
  }
  .retry-btn:hover{ border-color:var(--amber); color:var(--amber); transform:translateY(-2px); }

  .share-x{
    margin-top:34px; display:inline-flex; align-items:center; gap:9px;
    background:#fff; color:#0f1419; border:none; padding:13px 24px; border-radius:999px;
    font-size:14px; font-weight:700; text-decoration:none; font-family:'Zen Kaku Gothic New', sans-serif;
    transition:transform .14s ease, opacity .14s ease;
  }
  .share-x:hover{ transform:translateY(-2px); opacity:.9; }
  .share-x svg{ width:16px; height:16px; fill:currentColor; }
  .share-x + br + .retry-btn{ margin-top:14px; }

  @media (max-width:520px){
    .choices, .choices.cols-3{ grid-template-columns:1fr; }
    .choices.tags-grid{ grid-template-columns:repeat(2, 1fr); }
    .card{ padding:26px 20px; }
  }
</style>

  {name:"チャート式 大学入学共通テスト対策 数学IA+IIBC",note:"数研出版のチャート式による共通テスト対策書で、数学I・AとII・B・Cを1冊で確認できます。チャート式で学んできた人が、そのまま共通テストの形式に移行するのに向いています。",asin:"4410106384",scope:"common",tier:2,purposes:["kyoutsuu"],type:"quality",bunya:[],krange:"both"},
  {name:"教科書だけでは足りない 統計的な推測（河合塾）",note:"河合出版の分野別シリーズで、統計的な推測を入試で使えるレベルまで解説します。教科書だけでは演習量が足りない統計分野を、共通テストに向けて固めたい人に向いています。",asin:"4777227529",scope:"common",tier:2,purposes:["bunyabetsu"],type:"quality",bunya:["統計的な推測"]},
  {name:"文系の数学 重要事項完全習得編",note:"河合出版の文系数学シリーズのうち、入試に必要な重要事項を網羅的に身につけるための1冊です。文系の受験生が網羅系の代わりに、入試で問われる典型を効率よく固めるのに向いています。",asin:"4777228665",scope:"bunkei",tier:2,purposes:["mouraikei","kyoutsuu"],type:"quality",bunya:[]},

  // ---- Tier3 応用・難関 ----
  {name:"1対1対応の演習（数学I・A/II・B）",note:"入試の典型問題を例題と演習題の1対1の形で学ぶ、東京出版の定番演習書です。網羅系参考書を終えたあと、解法を入試レベルで使いこなせるよう仕上げる段階で使います。新数学スタンダード演習との比較は解説記事で紹介しています。",asin:"4887422636",scope:"common",tier:3,purposes:["niji"],type:"quality",bunya:[]},
  {name:"1対1対応の演習（数学III）",note:"数学IIIの微積分や極限を例題と演習題の1対1形式で固める1冊です。理系の網羅系参考書から入試レベルの数IIIへ橋渡しする段階に向いています。",asin:"4887422792",scope:"rikei",tier:3,purposes:["niji"],type:"quality",bunya:[]},
  {name:"新数学スタンダード演習",note:"『大学への数学』の増刊として毎年出る、難関大レベルの典型問題を必要十分に網羅した演習書です。やり切れば難関大レベルまで届きますが、レイアウトが見づらく解説もシンプルなので、真・解法への道などのほうが取り組みやすい人も多い1冊です。比較は解説記事で紹介しています。",asin:"B0GK6S4JPF",scope:"common",tier:4,purposes:["niji"],type:"quantity",bunya:[],incl3:true,demote:true},
  {name:"文系の数学 良問プラチカ",note:"名前に反して理系プラチカより難しい、文系の範囲だけで解く難関〜最難関レベルの演習書です。論理をしっかり理解していないと解説も読みこなせないので、典型問題を仕上げた上位の文系向けです。数IIIが固まった理系が数IIの微積分など文理共通分野の盲点を埋めるのにも使えます。レベル感と使い方は解説記事で紹介しています。",asin:"4777227200",scope:"bunkei",tier:4,purposes:["niji"],type:"quantity",bunya:[]},
  {name:"理系数学の良問プラチカ",note:"理系数学の入試良問を集めた演習書で、標準からやや難の問題を収録しています。網羅系を終えた理系受験生が、難関国公立の二次試験に向けて演習量を確保するのに向いています。",asin:"4777227219",scope:"rikei",tier:3,purposes:["niji"],type:"quantity",bunya:[]},
  {name:"文系の数学 実践力向上編",note:"河合出版の文系数学シリーズのうち、入試の実戦問題で得点力を伸ばすための演習編です。重要事項を一通り身につけたあとに、記述式の入試問題を時間内に解き切る力を鍛えます。",asin:"4777231461",scope:"bunkei",tier:3,purposes:["niji"],type:"quantity",bunya:[]},
  {name:"マスターキー 数学I・A・II・B＋ベクトル",note:"東大理Ⅲ出身の河野玄斗さんによる問題集で、入試で繰り返し使う思考パターンを100個以上収録しています。数学を一通り学んだのに入試問題に歯が立たない人が、網羅系と併用して解法の引き出しを整理するのに向いています。",asin:"4053046408",scope:"common",tier:3,purposes:["niji"],type:"quality",bunya:[]},
  {name:"入試数学 解法のセオリー",note:"河合塾講師の伊東敦先生による、典型問題207題で定石の使い方を学ぶ1冊です。1題から多くを学んで別の問題に応用することを重視していて、中堅大から難関大までの二次・私大対策に使えます。",asin:"4777230163",scope:"common",tier:3,purposes:["niji"],type:"quality",bunya:[]},
  {name:"標準問題精講",note:"旺文社の問題精講シリーズのうち、入試の標準からやや難レベルを扱う1冊です。「精講」で考え方の要点を押さえてから問題に取り組む構成で、解説を読み込みながら実力を上げたい人に向いています。",asin:"4010349212",scope:"common",tier:3,purposes:["niji"],type:"quality",bunya:[]},
  {name:"標準問題精講 分野別（整数）",note:"旺文社の分野別標準問題精講のうち、整数分野を集中的に扱う1冊です。整数問題の典型解法を入試の標準レベルで固めたい人に向いています。",asin:"4010352639",scope:"common",tier:3,purposes:["bunyabetsu"],type:"quality",bunya:["整数"]},
  {name:"数学 二次曲線・複素数平面 分野別標準問題精講",note:"旺文社の分野別標準問題精講のうち、二次曲線と複素数平面を扱う1冊です。理系の人がこの2分野を入試の標準レベルで集中的に固めるのに向いています。",asin:"4010352663",scope:"rikei",tier:3,purposes:["bunyabetsu"],type:"quantity",bunya:["複素数平面"],profile:"workbook"},
  {name:"教科書だけでは足りない 大学入試攻略 複素数平面（河合塾）",note:"河合出版の分野別シリーズで、複素数平面を入試の発展レベルまで掘り下げます。複素数平面を得点源にしたい難関大志望の理系受験生に向いています。",asin:"4777214966",scope:"rikei",tier:4,purposes:["bunyabetsu"],type:"quantity",bunya:["複素数平面"],profile:"workbook"},
  {name:"坂田アキラの複素数平面が面白いほどわかる本",note:"坂田アキラ先生による、複素数平面を超基礎から手取り足取り解説する1冊です。複素数平面の意味から分からない人が、基本を一つずつ身につけるのに向いています。",asin:"4046020210",scope:"rikei",tier:1,purposes:["bunyabetsu"],type:"quality",bunya:["複素数平面"],unconditional:true},

  {name:"数学の受験教科書 7 複素数平面（カラー版）",note:"複素数平面を受験の教科書として体系的にまとめた分野別の1冊です。カラーの図解で複素数平面の考え方を整理しながら、入試の典型問題まで学べます。",asin:"B0DM6NKGWM",scope:"rikei",tier:3,purposes:["bunyabetsu"],type:"quality",bunya:["複素数平面"],profile:"lecture"},

  {name:"場合の数・確率 解法のパターン30（技術評論社）",note:"場合の数・確率の頻出解法を30のパターンに整理して学べる1冊です。確率の問題でどう数えればいいか迷う人が、解き方の型を身につけるのに向いています。",asin:"4774175773",scope:"common",tier:3,purposes:["bunyabetsu"],type:"quantity",bunya:["場合の数・確率"]},

  {name:"解法の探求・確率（東京出版）",note:"東京出版『大学への数学』シリーズの確率の問題集で、難関大の確率問題を多角的な解法で掘り下げる問題集です。解説で基礎から教える本ではないので、確率の基本が固まった東大・京大レベルの最上位層が仕上げに使う1冊です。",asin:"4887420862",scope:"common",tier:4,purposes:["bunyabetsu"],type:"quantity",bunya:["場合の数・確率"],elite:true},
  {name:"マスターオブ場合の数",note:"東京出版『大学への数学』シリーズの場合の数の問題集で、数え上げの考え方を難関大レベルを超えるところまで鍛えます。入試に必要な範囲を大きく超えるので、場合の数をさらに突き詰めたい最上位層が余力で取り組むオプションの1冊です。",asin:"4887420285",scope:"common",tier:4,purposes:["bunyabetsu"],type:"quantity",bunya:["場合の数・確率"],elite:true,optionOnly:true},
  {name:"Z会 理系数学の核心 標準編",note:"Z会の理系向け演習書で、入試標準レベルの問題を通して解法の核心となる考え方を身につけます。網羅系を終えた理系受験生が、記述式の二次試験に向けて思考の筋道を固めるのに向いています。",asin:"4865315926",scope:"rikei",tier:3,purposes:["niji"],type:"quality",bunya:[]},

  {name:"世界一わかりやすい 九大の理系数学",note:"KADOKAWA「世界一わかりやすい」シリーズの九州大学版で、最新版は理系と文系を1冊にまとめた『九大の数学』として前期日程17か年分を解説しています。頻出テーマを押さえられるので、九大志望者の過去問演習の前後に使うのが効果的です。",asin:"4046079673",scope:"rikei",tier:3,purposes:["niji"],type:"quality",bunya:[],shibouDetailOnly:["kyudai"]},
  {name:"世界一わかりやすい 九大の文系数学",note:"最新版は理系と文系を1冊にまとめた『九大の数学』として、前期日程17か年分の過去問を解説しています。九大文系志望者が頻出テーマと答案の書き方を押さえ、本番の出題形式に慣れるための1冊です。",asin:"4046079673",scope:"bunkei",tier:3,purposes:["niji"],type:"quality",bunya:[],shibouDetailOnly:["kyudai"]},
  {name:"入試数学「実力強化」問題集（駿台）",note:"駿台文庫の演習書で、網羅系の典型問題から一歩進んだ入試の標準からやや難の問題を扱います。解説が詳しいので、網羅系を終えた人が実戦力を上げる次の1冊として向いています。",asin:"4796113460",scope:"common",tier:3,purposes:["mouraikei","niji"],type:"quantity",bunya:[],mouraikei:true,incl3:true},
  {name:"入試のツボを押さえる重点学習 数学IA2BC",note:"東京出版の青木亮二先生による、入試で差がつくポイントを分野ごとに絞り込んで学ぶ1冊です。つまずきやすい誤解や考え方の手順を丁寧に示していて、典型問題の理解を一段深めたい人に向いています。",asin:"4887422857",scope:"common",tier:3,purposes:["niji"],type:"quality",bunya:[]},
  {name:"入試のツボを押さえる重点学習 数学3C",note:"同シリーズの数学III・C版で、平面上の曲線と複素数平面を中心に入試のツボを整理します。苦手になりやすいこれらの分野を重点的に固めたい理系受験生に向いています。",asin:"4887422881",scope:"rikei",tier:3,purposes:["niji"],type:"quality",bunya:[]},
  {name:"総合的研究 記述式答案の書き方",note:"旺文社「総合的研究」シリーズの1冊で、二次試験の記述答案をどう書けば採点者に伝わるかを学べます。論理の飛躍や書き漏れで減点されがちな人が、答案の型を身につけるのに向いています。",asin:"4010377240",scope:"common",tier:3,purposes:["niji"],type:"quality",bunya:[]},
  {name:"ハッとめざめる確率",note:"東京出版の安田亨先生による確率の問題集で、確率の考え方を根本から理解し直せる1冊です。確率の公式を当てはめるだけでは解けない入試問題に対応したい人に向いています。",asin:"4887420447",scope:"common",tier:3,purposes:["bunyabetsu"],type:"quality",bunya:["場合の数・確率"]},
  {name:"理系数学の極み",note:"医学部志望者の指導経験が豊富な岩崎達浩先生が著し、灘・開成の数学科教諭が監修した最難関向けの問題集です。例題・演習・医学部対策問題の計613問を収録し、全例題にヒント動画と解説動画が付いています。",asin:"4487633648",scope:"rikei",tier:3,purposes:["niji"],type:"quality",bunya:[]},
  {name:"方程式・図形・関数からとらえる数学の基礎 分野別標準問題精講",note:"旺文社の分野別標準問題精講のうち、方程式・図形・関数の基本的な考え方を横断的に扱う1冊です。軌跡や領域、同値変形の土台を入試レベルで固めたい人に向いています。",asin:"4010353996",scope:"common",tier:3,purposes:["niji","bunyabetsu"],type:"quality",bunya:["論理・軌跡と領域"]},
  {name:"大学入試 数学の発想力が1冊でしっかり身につく本",note:"佐々木隆宏先生による、数学I・A・II・Bの総合・融合問題で発想力を鍛える1冊です。方針の立て方・行き詰まったときの打開・定石の柔軟な応用という3つの力を、問題を通して身につけます。",asin:"4761231610",scope:"common",tier:3,purposes:["niji"],type:"quality",bunya:[]},

/* ============================================================
   フロー定義：状態遷移
   各質問は state.step で管理。answers に選択を蓄積。
   ============================================================ */
const routeColor = { teiki:"var(--lv1)", kyoutsuu:"var(--lv2)", niji:"var(--lv3)" };
const routeName = { teiki:"定期テスト対策", kyoutsuu:"共通テスト対策", niji:"二次試験対策" };

let answers = {};
// 戻る用：各ステップに入った時点の回答を保存しておき、戻るときはそこへ復元する
let stack = [{step:"start", snap:{}}];
const clone = o => JSON.parse(JSON.stringify(o));

const quizArea = document.getElementById("quiz-area");
const crumbsEl = document.getElementById("crumbs");

function renderCrumbs(){
  const labels = [];
  if(answers.purpose) labels.push(["目的", routeName[answers.purpose]]);
  if(answers.teikiRange) labels.push(["範囲", answers.teikiRange]);
  if(answers.kyoRange) labels.push(["範囲", answers.kyoRange]);
  if(answers.status) labels.push(["状況", answers.statusLabel]);
  if(answers.nijiType) labels.push(["種類", answers.nijiType === "bunya" ? "分野別" : "総合"]);
  if(answers.bunya) labels.push(["分野", answers.bunya]);
  if(answers.bunyaProfile) {
    const conf = BUNYA_EXTRA[answers.bunya];
    const choice = conf && conf.choices.find(c => c.value === answers.bunyaProfile);
    if(choice) labels.push(["方針", choice.label]);
  }
  if(answers.sougouRange) labels.push(["範囲", answers.sougouRange]);
  if(answers.mouraikeiLabel) labels.push(["方針", answers.mouraikeiLabel]);
  if(answers.hensachi) labels.push(["偏差値", answers.hensachi]);
  if(answers.shibou) labels.push(["志望", answers.shibouLabel]);
  if(answers.shibouDetailLabel) labels.push(["大学", answers.shibouDetailLabel]);
  if(answers.style) labels.push(["参考書", answers.style === "quality" ? "解説・講義" : "問題集"]);
  crumbsEl.innerHTML = labels.map(([k,v], i) =>
    (i>0?'<span class="crumb-arrow">→</span>':'') + `<span class="crumb"><span class="k">${k}</span><b>${v}</b></span>`
  ).join("");
}

function go(step){ stack.push({step, snap:clone(answers)}); renderStep(step); }
function back(){
  if(stack.length<=1) return;
  stack.pop();
  const top = stack[stack.length-1];
  answers = clone(top.snap);
  renderStep(top.step);
}

/* 進捗：回答済みの内容からこのルートの問数を見積もる */
function plannedSteps(){
  const a = answers, list = ["start"];
  if(!a.purpose) return null;
  if(a.purpose==="teiki") return list.concat(["teiki_range","teiki_status","teiki_book"]);
  if(a.purpose==="kyoutsuu") return list.concat(["kyo_range","kyo_status"], a.status==="none" ? [] : ["kyo_book"]);
  list.push("niji_type");
  if(!a.nijiType) return null;
  const detail = (a.shibou==="tokyoikko"||a.shibou==="kyutei");
  if(a.nijiType==="bunya"){
    list.push("niji_bunya");
    if(a.bunya && BUNYA_EXTRA[a.bunya]) list.push("niji_bunya_extra");
    list.push("niji_bunya_hensachi","niji_bunya_shibou");
    if(detail) list.push("niji_bunya_shibou_detail");
    list.push("niji_bunya_book");
    return list;
  }
  list.push("niji_sougou_range","niji_sougou_mouraikei","niji_sougou_status","niji_sougou_hensachi");
  if(a.status!=="hajime"){ list.push("niji_sougou_shibou"); if(detail) list.push("niji_sougou_shibou_detail"); }
  list.push("niji_sougou_book");
  return list;
}
function progressHtml(){
  const cur = stack.length;
  const plan = plannedSteps();
  const total = plan ? Math.max(plan.length, cur) : null;
  const pct = total ? Math.round((cur-1)/total*100) : 6;
  return `<div class="progress"><div class="p-label"><span><b>Q${cur}</b>${total?` / ${total}`:''}</span><span>${total?`あと${total-cur+1}問`:''}</span></div>
    <div class="p-bar"><i style="width:${pct}%"></i></div></div>`;
}

function renderQ(index, total, qText, choices, colClass){
  let html = progressHtml() + `<div class="card">
    <div class="q-index">${index}${total?` / ${total}`:''}</div>
    <p class="q-text">${qText}</p>
    <div class="choices ${colClass||''}">`;
  choices.forEach(c=>{
    html += `<button class="choice-btn" data-value="${c.value}"${c.label2?` data-label="${c.label2}"`:''}>
      ${c.label}${c.sub?`<span class="sub">${c.sub}</span>`:''}
    </button>`;
  });
  html += `</div></div>`;
  if(stack.length > 1){
    html += `<div class="nav-row"><button class="back-btn" id="back-btn">← 前の質問に戻る</button></div>`;
  }
  quizArea.innerHTML = html;
  renderCrumbs();
  const bb = document.getElementById("back-btn");
  if(bb) bb.addEventListener("click", back);
  return quizArea.querySelectorAll(".choice-btn");
}

function bindChoice(btns, handler){
  btns.forEach(b => b.addEventListener("click", ()=> handler(b.dataset.value, b.dataset.label)));
}

    case "start": return stepStart();

    case "teiki_range": return stepTeikiRange();

    case "niji_type": return stepNijiType();

    case "niji_bunya_extra": return stepNijiBunyaExtra();
    case "niji_bunya_hensachi": return stepBunyaHensachi();
    case "niji_bunya_shibou": return stepBunyaShibou();
    case "niji_bunya_shibou_detail": return stepBunyaShibouDetail();
    case "niji_bunya_book": return stepBunyaBook();
    case "niji_sougou_range": return stepSougouRange();
    case "niji_sougou_mouraikei": return stepSougouMouraikei();
    case "niji_sougou_status": return stepSougouStatus();
    case "niji_sougou_hensachi": return stepSougouHensachi();
    case "niji_sougou_shibou": return stepSougouShibou();
    case "niji_sougou_shibou_detail": return stepSougouShibouDetail();
    case "niji_sougou_book": return stepSougouBook();
    case "result": return renderResult();
  }
}

/* ============================================================
   結果算出
   ============================================================ */
function hensachiToTier(key){ return key==="lt50"?1 : key==="mid"?3 : 4; }
// 総合ルート専用：tier2（網羅系の標準帯）をきちんと拾えるように分野別とは別マッピングにする
function sougouHensachiToTier(key){ return key==="lt50"?1 : key==="mid"?2 : 4; }
function shibouToTier(key){
  if(key==="tokyoikko") return 4;
  if(key==="igaku") return 4;
  if(key==="kyutei") return 3;
  return 3; // その他
}
function statusToTier(status){
  // 定期・共通の初学系
  if(status==="none") return 1;
  if(status==="some") return 1;
  if(status==="much") return 2;
  return 2;
}
function rangeToScopes(){
  // 範囲文字列 → scope 許可リスト
  if(answers.purpose==="teiki"){
    const r = answers.teikiRange;
    if(["数III","複素数平面・式と曲線"].includes(r)) return ["common3","rikei"];
    return ["common"];
  }
  if(answers.purpose==="kyoutsuu"){
    return answers.kyoRange==="数IIBC" ? ["common"] : ["common"];
  }
  if(answers.purpose==="niji"){
    if(answers.nijiType==="sougou"){
      return answers.sougouRangeKey==="III" ? ["common3","rikei"] : ["common","bunkei"];
    }
    return ["common","rikei","bunkei"]; // 分野別は範囲不問
  }
  return ["common"];
}

function pickTier(){
  if(answers.purpose==="teiki") return statusToTier(answers.status);
  if(answers.purpose==="kyoutsuu") return answers.status==="none" ? 1 : 2;
  // 二次
  if(answers.nijiType==="bunya") {
    // 偏差値50未満は、志望校に関わらず無条件で基礎固め（tier1）から
    if(answers.hensachiKey === "lt50") return 1;
    // それ以外は偏差値と志望校の高い方を採用
    return Math.max(hensachiToTier(answers.hensachiKey), shibouToTier(answers.shibou));
  }
  // 総合
  if(answers.status==="hajime") return sougouHensachiToTier(answers.hensachiKey);
  // 範囲学習済み：偏差値50未満は志望校に関わらず無条件でtier1、それ以外は偏差値と志望校の高い方
  if(answers.hensachiKey === "lt50") return 1;
  return Math.max(sougouHensachiToTier(answers.hensachiKey), shibouToTier(answers.shibou));
}

/* 基礎問題精講は1位には出さない（基礎の段階は講義で理解する本を先に勧める）。1位になったら2位に下げる */
function kisoSeikoNotFirst(list){
  if(list.length > 1 && list[0].b.name.startsWith("基礎問題精講")) list.splice(1, 0, list.shift());
  return list;
}
/* 京大・阪大・九大志望の総合ルートでは「世界一わかりやすい」の各大学の数学を1位に出す
   （偏差値65以上の超上位層・問題集を選んだ人・偏差値50未満の人は今の1位を残して2位にする） */
function sekaiichiFirst(list){
  if(answers.purpose!=="niji" || answers.nijiType!=="sougou") return list;
  const univ = {kyodai:"京大", handai:"阪大", kyudai:"九大"}[answers.shibouDetail];
  if(!univ) return list;
  const i = list.findIndex(x => x.b.name.startsWith("世界一わかりやすい "+univ));
  if(i < 0) return list;
  const second = answers.hensachiKey==="gte65" || answers.style==="quantity" || answers.hensachiKey==="lt50";
  const pos = second ? 1 : 0;
  if(i > pos) list.splice(pos, 0, list.splice(i, 1)[0]);
  return list;
}
/* 共通テスト対策では共通テスト専用の本を上位に出す（専用書が足りないときだけ汎用書で埋める） */
function kyoutsuuFirst(list, get){
  if(answers.purpose!=="kyoutsuu") return list;
  const ded = x => { const p=get(x).purposes||[]; return p.length===1 && p[0]==="kyoutsuu"; };
  return list.filter(ded).concat(list.filter(x => !ded(x)));
}
/* 超上位層：偏差値65以上かつ東京一科・医学部志望 */
function isElite(){ return answers.hensachiKey==="gte65" && (answers.shibou==="tokyoikko" || answers.shibou==="igaku"); }
/* 場合の数・確率は本の数が少なく点数計算だと順位が崩れるので、条件ごとに順位を直接指定する */
function probOrder(){
  const S="坂田アキラの場合の数・確率・データの分析が面白いほどわかる本", G="合格る確率", P="場合の数・確率 解法のパターン30（技術評論社）", H="ハッとめざめる確率", K="解法の探求・確率（東京出版）", M="マスターオブ場合の数";
  const q = answers.style==="quality";
  if(answers.hensachiKey==="lt50") return [S,G,P,H];
  if(answers.hensachiKey==="mid") return [G,P,S,H];
  if(isElite()) return q ? [H,G,K,P,M] : [K,G,H,P,M];
  return q ? [H,G,P,S] : [G,H,P,S];
}
/* 定期テスト：範囲の合わない分冊を除く（数I・数Aを選んだら数II・B版、数II・数B・ベクトルを選んだら数I・A版を出さない） */
function teikiRangeOk(b){
  const n = b.name, hasII = n.includes("II") || n.includes("2BC"), hasIA = /I・A|I\+A|IA/.test(n);
  const r = answers.teikiRange;
  if(["数I","数A"].includes(r)) return !(hasII && !hasIA);
  if(["数II","数B","ベクトル"].includes(r)) return !(hasIA && !hasII);
  return true;
}
/* 定期テストは状況ごとに順位を直接指定する（はじはじは「まったく勉強していない」だけ） */
function teikiOrder(){
  const q = answers.style==="quality", st = answers.status;
  if(["数III","複素数平面・式と曲線"].includes(answers.teikiRange)){
    const K="基礎問題精講（数学III）", Y="やさしい高校数学（数学III・C）", T="数学のトリセツ！数学III", A="青チャート（チャート式 基礎からの数学III+C）", O="1対1対応の演習（数学III）";
    if(st==="none") return [Y,T,K];
    if(st==="some") return q ? [Y,K,T] : [K,Y,T];
    return q ? [A,O,K] : [O,A,K];
  }
  const IA = ["数I","数A"].includes(answers.teikiRange);
  const H="はじめからはじめる数学（マセマ）", N="入門問題精講", Y = IA ? "やさしい高校数学（数学I・A）" : "やさしい高校数学（数学II・B）", K="基礎問題精講（数学I・A/II・B）",
        W="白チャート（チャート式 基礎と演習）", A="青チャート（チャート式 基礎からの数学）", O="1対1対応の演習（数学I・A/II・B）", Ki="黄チャート（チャート式 解法と演習）";
  if(st==="none") return q ? [H,N,Y] : [H,N,K];
  if(st==="some") return q ? [N,W,K] : [W,N,K];
  return q ? [A,O,W] : [O,A,Ki];
}
function scoreBook(b, targetTier, scopes, purpose, style, bunya, bunyaHasMatch, krangeWanted, bunyaProfile, excludeBunyaSpecific, shibou, shibouDetail, mouraikeiChoice){
  // 数IIIを選んだときは scopes に "common3" が入る：文理共通の本は数IIIまで載っている本（incl3）だけ出す
  const bookScopes = (b.scope==="common" && b.incl3) ? ["common","common3"] : [b.scope];
  if(!bookScopes.some(x => scopes.includes(x))) return -Infinity;
  // 共通テストルート：範囲タグがある本は、選んだ範囲(IA/IIBC)と一致しないなら除外
  if(krangeWanted && b.krange && b.krange!=="both" && b.krange!==krangeWanted) return -Infinity;
  // 分野固有の追加質問（計算・ベクトルなど）：profileタグを持つ本は、選んだ方針と厳密一致しないと除外
  if(bunyaProfile && b.profile && b.profile !== bunyaProfile) return -Infinity;
  // 志望校限定タグ（粗め：東京一科/旧帝単位）：一致しない場合除外
  if(b.shibouOnly && !b.shibouOnly.includes(shibou)) return -Infinity;
  if(b.shibouExclude && b.shibouExclude.includes(shibou)) return -Infinity;
  // 志望校限定タグ（詳細：大学名単位）：一致しない場合除外
  if(b.shibouDetailOnly && !b.shibouDetailOnly.includes(shibouDetail)) return -Infinity;
  // 志望校ピンポイント一致：大学名指定の本は、同格の汎用書より優先する（ただしtierが完全一致する場合のみ。tierが離れた本にボーナスで下駄を履かせない）
  const shibouBonus = (b.tier === targetTier && ((b.shibouOnly && b.shibouOnly.includes(shibou)) || (b.shibouDetailOnly && b.shibouDetailOnly.includes(shibouDetail)))) ? 4 : 0;
  // 網羅系の希望：総合ルートで「網羅系を使いたい/使いたくない」を選んだ場合、厳密に一致する本だけ残す
  if(mouraikeiChoice==="yes" && !b.mouraikei) return -Infinity;
  if(mouraikeiChoice==="no" && b.mouraikei) return -Infinity;
  // 分野別診断：分野が指定されている場合、その分野の専用タグを持たない本は一切候補にしない
  // （総合書へのフォールバックは行わない。該当0冊なら「該当なし」を表示する）
  if(bunya && !b.bunya.includes(bunya)) return -Infinity;
  if(b.elite && !isElite()) return -Infinity;
  // 総合診断（分野別以外）：分野別専用タグを持つ本は逆に一切候補にしない
  // （「総合」を選んだのに特定分野の本が紛れ込むのを防ぐ）
  if(excludeBunyaSpecific && b.bunya && b.bunya.length > 0) return -Infinity;
  // 「無条件で最優先」フラグ：目標tierと一致する場合、質/量やprofileに関わらず最優先にする
  if(b.unconditional && b.tier === targetTier) return 1000;
  let s = 0;
  // tier近さ
  s += 5 - Math.abs(b.tier - targetTier)*2;
  // 目的一致
  if(b.purposes.includes(purpose)) s += 3;
  // スタイル
  if(style==="quality" && b.type==="quality") s += 2;
  if((style==="quantity"||style==="jissen") && b.type==="quantity") s += 2;
  if(b.demote) s -= 3; // 新数学スタンダード演習：力はつくが勧められる人が限られるので、同じレベルの真・解法への道などより下に出す
  return s + shibouBonus;
}

/* 一致度と「選ばれた理由」：scoreBook と同じ基準で内訳を出す */
const PURPOSE_TAG = { teiki:"定期テスト向け", kyoutsuu:"共通テスト向け", niji:"二次試験向け" };
function hasShibouBonus(b, targetTier){
  return b.tier === targetTier && ((b.shibouOnly && b.shibouOnly.includes(answers.shibou)) || (b.shibouDetailOnly && b.shibouDetailOnly.includes(answers.shibouDetail)));
}
function explainBook(b, s, targetTier, purpose, maxScore){
  const tags = [];
  if(b.unconditional && b.tier === targetTier) tags.push({t:"この条件の定番"});
  const d = b.tier - targetTier;
  if(d===0) tags.push({t:"レベルがぴったり"});
  else if(d>0) tags.push({t:"やや難しめ", warn:true});
  else tags.push({t:"やや易しめ", warn:true});
  if(b.purposes.includes(purpose)) tags.push({t:PURPOSE_TAG[answers.purpose]});
  const st = answers.style;
  if(st==="quality" && b.type==="quality") tags.push({t:"解説・講義型"});
  if((st==="quantity"||st==="jissen") && b.type==="quantity") tags.push({t:"問題演習型"});
  if(answers.bunya) tags.push({t:`${answers.bunya}に特化`});
  if(b.optionOnly) tags.push({t:"上級者向けオプション", warn:true});
  if(hasShibouBonus(b, targetTier)) tags.push({t:`${answers.shibouDetailLabel || answers.shibouLabel}志望向け`});
  const pct = s >= 1000 ? 100 : Math.max(0, Math.min(100, Math.round(s / maxScore * 100)));
  return {pct, tags};
}
/* 回答内容と一致理由から「あなたへのひとこと」を組み立てる */
function hitokoto(ex){
  const who = [];
  if(answers.hensachi) who.push(`偏差値${answers.hensachi}`);
  const sh = answers.shibouDetailLabel || answers.shibouLabel;
  if(sh && sh !== "その他") who.push(`${sh}志望`);
  const lead = who.length ? `${who.join("で")}なら、` : "今の条件なら、";
  const t = ex.tags.map(x=>x.t);
  let body;
  if(t.includes("やや難しめ")) body = "少し背伸びになるので、前段階の本と並行すると効果的です。";
  else if(t.includes("やや易しめ")) body = "穴を埋める総復習として短期間で回すのに向いています。";
  else body = "今のレベルにちょうど合う1冊です。";
  const bonus = t.some(x=>/志望向け$/.test(x)) ? "志望校の出題傾向に直結する1冊でもあります。" : "";
  return lead + body + bonus;
}

/* 上位3冊の説明文を生成AIのように1文字ずつ表示する */
function typeDescriptions(){
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const list = document.querySelector(".book-list");
  if(!list || reduce) return;
  const items = Array.from(list.querySelectorAll(":scope > .book-item")).slice(0,3);
  const jobs = items.map(item => {
    const desc = item.querySelector(".desc");
    if(!desc) return null;
    desc.style.minHeight = desc.offsetHeight + "px";
    const walker = document.createTreeWalker(desc, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while(walker.nextNode()) nodes.push({node:walker.currentNode, text:walker.currentNode.nodeValue});
    nodes.forEach(n => n.node.nodeValue = "");
    const job = {item, desc, nodes, ni:0, ci:0, done:false, caret:null};
    item.addEventListener("click", e => { if(e.target.closest("a")) return; finish(job); }, {once:true});
    return job;
  }).filter(Boolean);
  function finish(job){
    if(job.done) return;
    job.nodes.forEach(n => n.node.nodeValue = n.text);
    if(job.caret) job.caret.remove();
    job.done = true; job.desc.style.minHeight = "";
  }
  let k = 0;
  function step(){
    while(k < jobs.length && jobs[k].done) k++;
    if(k >= jobs.length) return;
    const job = jobs[k];
    if(!job.caret){ job.caret = document.createElement("span"); job.caret.className = "type-caret"; }
    const cur = job.nodes[job.ni];
    if(!cur){ finish(job); k++; setTimeout(step, 260); return; }
    if(job.caret.previousSibling !== cur.node) cur.node.parentNode.insertBefore(job.caret, cur.node.nextSibling);
    job.ci++;
    cur.node.nodeValue = cur.text.slice(0, job.ci);
    if(job.ci >= cur.text.length){ job.ni++; job.ci = 0; }
    setTimeout(step, 25);
  }
  setTimeout(step, 350);
}

function bookItemHtml(b, i, chipLabel, chipBg, ex, isSub){
  const cv = COVERS[b.name];
  const scopeLabel = b.scope==="rikei"?"理系範囲":(b.scope==="bunkei"?"文系範囲":"");
  return `<div class="book-item rank-${i+1}">
    <div class="book-chip${isSub?' sub-rank':''}" style="background:${chipBg}; color:var(--ink);">${chipLabel}</div>
    <div class="book-info">
      ${cv&&cv.i?`<a class="book-cover" href="${cv.u}" target="_blank" rel="sponsored noopener" aria-label="${b.name}を楽天で見る"><img src="${cv.i}" alt="${b.name}の表紙" width="84" height="120" loading="lazy" decoding="async"><span>楽天で見る</span></a>`:''}
      <p class="name">${b.name}${scopeLabel?`<span class="scope-tag">${scopeLabel}</span>`:''}</p>
      <div class="match"><span class="m-num">一致度 ${ex.pct}%</span><span class="m-bar"><i style="width:${ex.pct}%"></i></span></div>
      <div class="reasons">${ex.tags.map(x=>`<span${x.warn?' class="warn"':''}>${x.t}</span>`).join('')}</div>
      <p class="desc">${b.note?`<span class="d-note">${b.note}</span>`:''}<span class="d-you"><b>あなたへのひとこと</b>${hitokoto(ex)}</span></p>
      <div class="book-actions">
        <a class="buy-link" href="${amazonUrl(b)}" target="_blank" rel="sponsored noopener">Amazonで見る</a>
        ${cv?`<a class="buy-link buy-rakuten" href="${cv.u}" target="_blank" rel="sponsored noopener">楽天で見る</a>`:''}
        ${b.article?`<a class="article-link" href="articles/${b.article}.html">解説記事を読む →</a>`:''}
      </div>
    </div>
  </div>`;
}

/* Xでシェア（1位の本のみ。偏差値・志望校は載せない） */
function shareXHtml(subject, bookName, page){
  const url = "https://jukenshindan.com/" + page + "?utm_source=x&utm_medium=share";
  const text = subject + "の参考書診断の結果、私のイチオシは『" + bookName + "』でした！\n#受験診断ドットコム #参考書診断";
  const href = "https://x.com/intent/post?text=" + encodeURIComponent(text) + "&url=" + encodeURIComponent(url);
  return `<a class="share-x" href="${href}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>結果をXでシェア</a><br>`;
}

function renderResult(){
  const targetTier = pickTier();
  const scopes = rangeToScopes();
  const purposeForMatch = answers.purpose==="niji" ? "niji" : answers.purpose;
  const bunya = answers.bunya || null;
  const krangeWanted = answers.purpose==="kyoutsuu" ? (answers.kyoRange==="数IA" ? "IA" : "IIBC") : null;
  // 二次試験ルートで「総合」を選んだ場合は、分野別専用の本を除外する
  const excludeBunyaSpecific = (answers.purpose==="niji" && answers.nijiType==="sougou");

  let scored = BOOKS.map(b => ({b, s:scoreBook(b, targetTier, scopes, purposeForMatch, answers.style, bunya, null, krangeWanted, answers.bunyaProfile, excludeBunyaSpecific, answers.shibou, answers.shibouDetail, answers.mouraikeiChoice)}))
                    .filter(x => x.s > -Infinity)
                    .sort((a,b)=> b.s - a.s);
  scored = kyoutsuuFirst(scored, x => x.b);
  if(answers.purpose==="teiki"){
    const order = teikiOrder();
    const H = "はじめからはじめる数学（マセマ）";
    scored = order.map(n => BOOKS.find(b => b.name===n)).filter(Boolean).map(b => ({b}))
      .concat(scored.filter(x => !order.includes(x.b.name) && x.b.purposes.includes("teiki") && !(x.b.bunya && x.b.bunya.length) && teikiRangeOk(x.b) && !(x.b.name===H && answers.status!=="none") && !x.b.unconditional))
      .map((x,i) => ({b:x.b, s:10 - i}));
  }
  if(bunya==="場合の数・確率"){
    const order = probOrder();
    scored = order.map(n => scored.find(x => x.b.name===n)).filter(Boolean)
      .concat(scored.filter(x => !order.includes(x.b.name)))
      .map((x,i) => ({b:x.b, s:10 - i}));
  }
  scored = kisoSeikoNotFirst(scored);
  scored = sekaiichiFirst(scored);
  let picks = scored.slice(0, 3).map(x=>x.b);
  const others = scored.slice(3, 6);
  const maxScore = 10 + (scored.some(x => hasShibouBonus(x.b, targetTier)) ? 4 : 0);
  const exOf = x => explainBook(x.b, x.s, targetTier, purposeForMatch, maxScore);

  const color = routeColor[answers.purpose];
  const rname = routeName[answers.purpose];

  document.getElementById("page-title").innerHTML = "診断結果";
  document.getElementById("page-lead").innerHTML = picks.length<=1 ? "あなたに一番合う参考書はこちらです。" : ("あなたに一番合う参考書、ベスト" + picks.length + "はこちら。");

  let summaryParts = [];
  if(answers.teikiRange) summaryParts.push(answers.teikiRange);
  if(answers.kyoRange) summaryParts.push(answers.kyoRange);
  if(answers.bunya) summaryParts.push(answers.bunya);
  if(answers.sougouRange) summaryParts.push(answers.sougouRange);
  if(answers.hensachi) summaryParts.push("偏差値"+answers.hensachi);
  if(answers.shibouLabel) summaryParts.push(answers.shibouLabel+"志望");

  const MEDAL = ["var(--amber)", "#C7CDD6", "#C98A4B"]; // 金・銀・銅
  const MEDAL_LABEL = ["No.1 イチオシ", "No.2", "No.3"];

  let bodyHtml;
  if(picks.length===0){
    bodyHtml = bunya
      ? `<div class="empty-note">「${bunya}」に特化した参考書は、まだデータベースにありません。他の分野を選ぶか、しばらくお待ちください。</div>`
      : '<div class="empty-note">条件に合う参考書が見つかりませんでした。選択を変えてもう一度お試しください。</div>';
  } else {
    let podiumHtml = '';
    if(picks.length >= 2){
      const podiumOrder = picks.length===3 ? [1,0,2] : [0,1];
      podiumHtml = '<div class="podium">';
      podiumOrder.forEach(idx=>{
        if(idx===undefined || !picks[idx]) return;
        const heightClass = idx===0 ? "podium-1" : (idx===1 ? "podium-2" : "podium-3");
        podiumHtml += `
          <div class="podium-col ${heightClass}">
            <div class="podium-book" style="background:${MEDAL[idx]}">
              <span class="podium-rank">${idx+1}</span>
            </div>
            <div class="podium-base" style="background:${MEDAL[idx]}"></div>
          </div>`;
      });
      podiumHtml += '</div>';
    }

    let listHtml = '<div class="book-list">';
    scored.slice(0,3).forEach((x,i)=>{
      const chipLabel = picks.length===1 ? "イチオシ" : MEDAL_LABEL[i];
      listHtml += bookItemHtml(x.b, i, chipLabel, MEDAL[i], exOf(x), false);
    });
    listHtml += '</div>';
    if(others.length){
      listHtml += `<details class="more-books"><summary>ほかの候補（${others.length}冊）</summary><div class="book-list">`;
      others.forEach((x,k)=>{ listHtml += bookItemHtml(x.b, 3+k, `No.${4+k}`, "", exOf(x), true); });
      listHtml += '</div></details>';
    }

    const prHtml = '<p class="pr-note"><span class="pr-tag">PR</span>このページにはアフィリエイト広告が含まれています</p>';
    bodyHtml = prHtml + podiumHtml + listHtml;
  }

  quizArea.innerHTML = `
    <div class="result-head">
      <span class="route-badge" style="background:${color}">${rname}</span>
      <h2>${summaryParts.join(" ・ ")}</h2>
    </div>
    ${bodyHtml}
    <div style="text-align:center;">${picks.length ? shareXHtml("数学", picks[0].name, "sugaku-shindan.html") : ''}
      <button class="retry-btn" id="retry-btn">もう一度診断する</button>
    </div>
    <p class="disclaimer" style="margin-top:28px;">
      ※本診断は一般的な学習ルートの目安であり、個々の学力・志望校の出題傾向によって最適な参考書は異なります。<br>
      ※Amazonのアソシエイトとして、当メンバーは適格販売により収入を得ています。
    </p>
  `;
  renderCrumbs();
  typeDescriptions();
  document.getElementById("retry-btn").addEventListener("click", ()=>{
    answers = {}; stack = [{step:"start", snap:{}}];
    document.getElementById("page-title").innerHTML = "目的別・数学参考書診断";
    document.getElementById("page-lead").innerHTML = "「何の対策がしたいか」から始めて、あなたにぴったりの参考書を診断します。";
    renderStep("start");
  });
}

/* init */
renderStep("start");
</script>
