    <div class="doc-card">
      <form id="contact-form" action="https://formsubmit.co/sinsengumisoutyou@gmail.com" method="POST">
        <input type="hidden" name="_subject" value="【受験診断ドットコム】お問い合わせ">

        <div class="field">
          <label for="name">お名前<span class="required">必須</span></label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
          <label for="email">メールアドレス<span class="required">必須</span></label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="subject">件名</label>
          <input type="text" id="subject" name="subject" placeholder="例：数学参考書診断について">
        </div>
        <div class="field">
          <label for="message">お問い合わせ内容<span class="required">必須</span></label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="border:none; cursor:pointer;">送信する</button>
        <p class="submit-note" id="submit-note">内容を確認のうえ、ご入力のメールアドレスへ順次返信します。</p>
